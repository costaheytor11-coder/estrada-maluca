<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estrada Maluca</title>
<style>
:root{--bg:#e9e6f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0b22}}
:root[data-theme="dark"]{--bg:#0f0b22}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{height:100%;max-width:100%;aspect-ratio:9/16;display:block;background:#2b2b35}
</style>
</head>
<body>
<canvas id="c" width="360" height="640"></canvas>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=360,H=640,LW=W/3,CW=54,CH=92,PY=H-150;
const COLS=['#e5384f','#f5a623','#12a150','#9b5de5','#00b4d8','#f15bb5'];
let st='menu',lane=1,px=LW*1.5,obs=[],spd=240,dist=0,off=0,tspawn=0,best=0,shake=0,last=0;
let lvl=1,lvlT=0,ci=0,md=0,tleft=0;
const FB='';
let tp=false,turn=0,sc=[0,0],showR=false,rank=[],nick='';
try{nick=localStorage.getItem('corrida_nick')||''}catch(e){}
function drawMo(){['Clássico','Tempo','Difícil','Zen','👥 2P'].forEach((n,k)=>{const sx=8+k*70,on=k<4?k===md:tp;x.fillStyle=on?'#5b3df5':'rgba(255,255,255,.14)';x.beginPath();x.roundRect(sx,36,64,32,10);x.fill();x.fillStyle='#fff';x.font='800 12px system-ui,sans-serif';x.textAlign='center';x.fillText(n,sx+32,57)})}
let P=[];
function sv(o){o.lane=lane;o.px=px;o.obs=obs;o.spd=spd;o.dist=dist;o.off=off;o.tspawn=tspawn;o.shake=shake;o.lvl=lvl;o.lvlT=lvlT;o.slip=slip;o.curve=curve;o.turbo=turbo;o.got=got;o.tleft=tleft}
function ld(o){lane=o.lane;px=o.px;obs=o.obs;spd=o.spd;dist=o.dist;off=o.off;tspawn=o.tspawn;shake=o.shake;lvl=o.lvl;lvlT=o.lvlT;slip=o.slip;curve=o.curve;turbo=o.turbo;got=o.got;tleft=o.tleft}
function setCanvas(t){cv.width=t?720:360;cv.height=640;cv.style.aspectRatio=t?'9/8':'';cv.style.height=t?'auto':'';cv.style.width=t?'100%':''}
function startSplit(){setCanvas(true);P=[0,1].map(()=>{reset();const o={};sv(o);o.dead=false;o.final=0;return o});st='split'}
function endSplit(){setCanvas(false);st='menu';turn=0}
function updS(dt){
 if(st!=='split')return;
 for(let i=0;i<2;i++){
  if(P[i].dead)continue;
  ld(P[i]);turn=i;st='play';
  update(dt);
  if(st==='over'){P[i].dead=true;P[i].final=Math.floor(dist/10)}
  st='split';sv(P[i]);
 }
 if(P[0].dead&&P[1].dead)st='splitover';
}
function drawS(){
 x.fillStyle='#111';x.fillRect(0,0,720,640);
 const was=st;
 for(let i=0;i<2;i++){
  ld(P[i]);turn=i;st='play';
  x.save();x.translate(i*360,0);x.beginPath();x.rect(0,0,360,640);x.clip();
  draw();
  if(P[i].dead){x.fillStyle='rgba(10,8,30,.6)';x.fillRect(0,0,360,640);txt('Bateu! 💥',300,34,'#fff');txt(P[i].final+' m',350,26,'#ffd23f')}
  x.restore();sv(P[i]);st=was;
 }
 x.fillStyle='#fff';x.fillRect(358,0,4,640);
 if(st==='splitover'){
  x.fillStyle='rgba(10,8,30,.8)';x.fillRect(0,0,720,640);
  const a=P[0].final,b=P[1].final;
  x.textAlign='center';x.fillStyle='#fff';x.font='800 44px system-ui,sans-serif';x.fillText(a>b?'Jogador 1 venceu!':a<b?'Jogador 2 venceu!':'Empate!',360,250);
  x.fillStyle='#ffd23f';x.font='800 34px system-ui,sans-serif';x.fillText(a+' m  x  '+b+' m',360,320);
  x.fillStyle='#cfc8ff';x.font='700 22px system-ui,sans-serif';x.fillText('Toque pra voltar',360,400);
 }
}
function tapStart(){
 if(showR){showR=false;return}
 if(tp){startSplit();return}
 if(st==='over')sendRank();
 reset();
}
async function sendRank(){
 const sv=Math.floor(dist/10);
 if(!FB||tp||sv<1)return;
 if(!nick){nick=(prompt('Seu nome pro ranking (até 12 letras):')||'').trim().slice(0,12);try{localStorage.setItem('corrida_nick',nick)}catch(e){}}
 if(!nick)return;
 try{const u=FB+'/rank/'+md+'/'+nick.replace(/[.#$\/\[\]]/g,'_')+'.json';const r=await(await fetch(u)).json();if(!r||sv>r.s)await fetch(u,{method:'PUT',body:JSON.stringify({n:nick,s:sv})});getRank()}catch(e){}
}
async function getRank(){
 if(!FB)return;
 try{const r=await(await fetch(FB+'/rank/'+md+'.json')).json();rank=Object.values(r||{}).sort((a,b)=>b.s-a.s).slice(0,5)}catch(e){}
}
function drawX(){
 if(tp&&st==='over'){const v=Math.floor(dist/10);txt(turn===0?'Vez do Jogador 2: passe o celular!':(sc[0]>v?'Jogador 1 venceu!':sc[0]<v?'Jogador 2 venceu!':'Empate!')+' ('+sc[0]+' x '+v+')',372,16,'#7CFFB2')}
 x.textAlign='center';x.font='700 13px system-ui,sans-serif';x.fillStyle='#ffd23f';x.fillText('🏆 Ver ranking',W/2,552);
 if(showR){
  x.fillStyle='rgba(10,8,30,.96)';x.beginPath();x.roundRect(30,150,300,300,16);x.fill();
  txt('Ranking · '+['Clássico','Tempo','Difícil','Zen'][md],190,18,'#fff');
  if(!FB){txt('Ranking ainda não ativado',270,15,'#cfc8ff')}
  else if(!rank.length){txt('Sem recordes ainda',270,15,'#cfc8ff')}
  else rank.forEach((r,i)=>txt((i+1)+'. '+r.n+' - '+r.s+' m',230+i*32,17,i?'#fff':'#ffd23f'));
  txt('Toque pra fechar',430,13,'#cfc8ff')
 }
}
function fin(){st='over';const s=Math.floor(dist/10);if(s>best){best=s;try{localStorage.setItem(md?'corrida_best'+md:'corrida_best',s)}catch(e){}}}
const PCOLS=['#5b3df5','#e5384f','#12a150','#f5a623','#00b4d8','#f15bb5'];
const THEMES=[{n:'Cidade',r:'#2b2b35',e:'#f5a623',g:'#1f3b2a'},{n:'Deserto',r:'#6b5636',e:'#f2d08a',g:'#c9a15a'},{n:'Neve',r:'#5d6b7e',e:'#e8f4ff',g:'#dcebf7'},{n:'Noite',r:'#1c1740',e:'#9d8bff',g:'#0a0820'}];
const DIM={car:[CW,CH],truck:[60,150],cone:[28,28],oil:[70,50]};
let curve=0,slip=0;
const sh=y=>{const d=Math.max(0,(PY-y)/PY);return curve*d*d*90};
function mk(l,y){const r=Math.random();const t=r<.45?'car':(r<.65&&lvl>1)?'truck':r<.85?'cone':lvl>1?'oil':'cone';return{l:l,y:-DIM[t][1]-y,c:COLS[Math.floor(Math.random()*COLS.length)],t:t}}
function obj(o){
 const cx=(o.l+.5)*LW+sh(o.y),cy=o.y;
 if(o.t==='truck'){x.fillStyle='#111';x.fillRect(cx-34,cy-70,8,28);x.fillRect(cx+26,cy-70,8,28);x.fillRect(cx-34,cy+42,8,28);x.fillRect(cx+26,cy+42,8,28);x.fillStyle='#d9d9e8';x.beginPath();x.roundRect(cx-30,cy-75,60,150,8);x.fill();x.fillStyle=o.c;x.fillRect(cx-30,cy-75,60,34);x.fillStyle='rgba(255,255,255,.75)';x.fillRect(cx-22,cy-62,44,12)}
 else if(o.t==='coin'){x.fillStyle='#ffd23f';x.beginPath();x.arc(cx,cy,12,0,7);x.fill();x.strokeStyle='#b8860b';x.lineWidth=3;x.stroke();x.fillStyle='#b8860b';x.fillRect(cx-2,cy-6,4,12)}
 else if(o.t==='bolt'){x.fillStyle='#00e5ff';x.beginPath();x.arc(cx,cy,18,0,7);x.fill();x.fillStyle='#fff';x.font='800 22px system-ui,sans-serif';x.textAlign='center';x.fillText('⚡',cx,cy+8)}
 else if(o.t==='cone'){x.fillStyle='#ff7a00';x.beginPath();x.moveTo(cx,cy-16);x.lineTo(cx+14,cy+14);x.lineTo(cx-14,cy+14);x.fill();x.fillStyle='#fff';x.fillRect(cx-8,cy-2,16,6)}
 else if(o.t==='oil'){x.fillStyle='rgba(0,0,0,.7)';x.beginPath();x.ellipse(cx,cy,34,22,0,0,7);x.fill();x.fillStyle='rgba(157,139,255,.35)';x.beginPath();x.ellipse(cx-6,cy-4,14,8,0,0,7);x.fill()}
 else car(cx,cy,o.c);
}
let wallet=0,got=0,turbo=0,own=[1,1,0,0,0,0];const PRICE=[0,0,30,50,80,120];
try{ci=+localStorage.getItem('corrida_col')||0}catch(e){}
let ms=[0,0,0],mban=0,mtxt='';const R=[10,20,30,40,60];
const LAD=[{k:'coins',tx:'Colete {n} moedas numa corrida',n:[10,20,35,50,80]},{k:'dist',tx:'Percorra {n} m numa corrida',n:[300,600,1000,1500,2500]},{k:'lvl',tx:'Chegue ao nível {n}',n:[2,3,4,5,7]}];
function drawM(){x.textAlign='center';x.font='700 13px system-ui,sans-serif';LAD.forEach((L,i)=>{const s=ms[i];x.fillStyle=s>=5?'#7CFFB2':'#fff';x.fillText(s>=5?'✅ '+L.tx.replace('{n}',L.n[4])+' · feita!':'🎯 '+L.tx.replace('{n}',L.n[s])+' · +'+R[s]+' 🪙',W/2,398+i*18)})}
function chkM(){LAD.forEach((L,i)=>{const s=ms[i];if(s>=5)return;const v=L.k==='coins'?got:L.k==='dist'?Math.floor(dist/10):lvl;if(v>=L.n[s]){wallet+=R[s];ms[i]++;mban=3;mtxt='Missão cumprida! +'+R[s]+' 🪙';sfx(4);savew();try{localStorage.setItem('corrida_ms',JSON.stringify(ms))}catch(e){}}})}
try{ms=JSON.parse(localStorage.getItem('corrida_ms')||'[0,0,0]')}catch(e){}
try{wallet=+localStorage.getItem('corrida_w')||0;own=JSON.parse(localStorage.getItem('corrida_own')||'[1,1,0,0,0,0]')}catch(e){}
function savew(){try{localStorage.setItem('corrida_w',wallet);localStorage.setItem('corrida_own',JSON.stringify(own))}catch(e){}}
function pick(k){if(own[k]){ci=k}else if(wallet>=PRICE[k]){wallet-=PRICE[k];own[k]=1;ci=k;sfx(1);savew()}else{sfx(5);return}try{localStorage.setItem('corrida_col',k)}catch(e){}}
let AC=null;const S={1:[988,.1,'square'],2:[90,.45,'sawtooth'],3:[300,.12,'triangle'],4:[1200,.3,'sine'],5:[180,.15,'square']};
function sfx(n){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const s=S[n];if(!s)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=s[2];o.frequency.setValueAtTime(s[0],t);if(n===2)o.frequency.exponentialRampToValueAtTime(30,t+s[1]);if(n===4)o.frequency.exponentialRampToValueAtTime(2000,t+s[1]);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+s[1]);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+s[1])}catch(e){}}
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
try{md=+localStorage.getItem('corrida_md')||0}catch(e){}
function setMode(k){md=k;try{localStorage.setItem('corrida_md',k);best=+localStorage.getItem(md?'corrida_best'+md:'corrida_best')||0}catch(e){}}
setMode(md);
function reset(){lane=1;px=LW*1.5;obs=[];spd=md===2?320:240;tleft=md===1?60:md===3?90:0;dist=0;tspawn=200;shake=0;lvl=1;lvlT=0;slip=0;curve=0;turbo=0;got=0;st='play'}
function move(d){if(st==='play')lane=Math.max(0,Math.min(2,lane+d))}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();sfx(0);
 const r=cv.getBoundingClientRect(),gx=(e.clientX-r.left)*cv.width/r.width,gy=(e.clientY-r.top)*cv.height/r.height;
 if(st==='split'){const i=gx<360?0:1,lx=gx-i*360;if(!P[i].dead)P[i].lane=Math.max(0,Math.min(2,P[i].lane+(lx<180?-1:1)));return}
 if(st==='splitover'){endSplit();return}
 if(st!=='play'){
  if(gy<80){const k=Math.floor((gx-8)/70);if(k>=0&&k<5&&gx-8-k*70<=64){if(k<4)setMode(k);else{tp=!tp;turn=0;sc=[0,0]}}return}
  if(gy>=530&&gy<556){showR=!showR;if(showR)getRank();return}
  if(gy>=545){const k=Math.floor((gx-42)/48);if(k>=0&&k<6&&gx-42-k*48<=36){pick(k)}return}
  tapStart();return}
 move(gx<W/2?-1:1);
});
addEventListener('keydown',e=>{
 const k=e.key;
 if(st!=='play'&&(k===' '||k==='Enter')){reset();return}
 if(k==='ArrowLeft'||k==='a')move(-1);
 if(k==='ArrowRight'||k==='d')move(1);
});
function car(cx,cy,col,p){
 x.fillStyle='#111';
 x.fillRect(cx-CW/2-4,cy-CH/2+10,8,22);x.fillRect(cx+CW/2-4,cy-CH/2+10,8,22);
 x.fillRect(cx-CW/2-4,cy+CH/2-32,8,22);x.fillRect(cx+CW/2-4,cy+CH/2-32,8,22);
 x.fillStyle=col;x.beginPath();x.roundRect(cx-CW/2,cy-CH/2,CW,CH,12);x.fill();if(p){x.strokeStyle='#fff';x.lineWidth=3;x.stroke()}
 x.fillStyle='rgba(255,255,255,.75)';x.beginPath();x.roundRect(cx-CW/2+7,cy-CH/2+24,CW-14,18,5);x.fill();
 x.fillStyle='rgba(0,0,0,.25)';x.fillRect(cx-CW/2+7,cy+6,CW-14,22);
}
function update(dt){
 if(st!=='play')return;
 const m=turbo>0?1.6:1;if(turbo>0)turbo-=dt;spd=Math.min(md===2?800:md===3?420:720,spd+(md===2?9:7)*dt);
 const nl=1+Math.floor(dist/10/250);
 if(nl>lvl){lvl=nl;lvlT=2.5;spd+=30}
 if(lvlT>0)lvlT-=dt;
 chkM();if(mban>0)mban-=dt;if(md===1||md===3){tleft-=dt;if(tleft<=0){fin();return}}curve=Math.min(1,.4+lvl*.2)*(.7*Math.sin(dist/2600)+.3*Math.sin(dist/1000));
 dist+=spd*m*dt;off=(off+spd*m*dt)%80;
 px+=((lane+.5)*LW-px)*Math.min(1,dt*(slip>0?3:14));if(slip>0)slip-=dt;
 tspawn-=spd*m*dt;
 if(tspawn<=0){
  const a=Math.floor(Math.random()*3);
  obs.push(mk(a,0));
  if(Math.random()<.35){let b=(a+1+Math.floor(Math.random()*2))%3;obs.push(mk(b,20))}else{const cl=(a+1+Math.floor(Math.random()*2))%3;if(Math.random()<.12)obs.push({l:cl,y:-60,c:'',t:'bolt'});else for(let k=0;k<4;k++)obs.push({l:cl,y:-40-k*60,c:'',t:'coin'})}
  tspawn=(Math.max(290,420-dist/60)+Math.random()*120)*(md===2?.8:1);
 }
 for(const o of obs){
  o.y+=spd*m*.55*dt;
  const ox=(o.l+.5)*LW;
  const D=DIM[o.t]||DIM.car;
  if(o.t==='coin'){if(Math.abs(ox-px)<46&&Math.abs(o.y-PY)<60){o.dead=1;got++;wallet+=md===2?2:1;if(md===1)tleft+=2;savew();sfx(1)}}
  else if(o.t==='bolt'){if(Math.abs(ox-px)<46&&Math.abs(o.y-PY)<60){o.dead=1;turbo=5;sfx(4)}}
  else if(o.t==='oil'){if(Math.abs(ox-px)<(CW+D[0])/2&&Math.abs(o.y-PY)<(CH+D[1])/2)slip=1.2}
  else if(Math.abs(ox-px)<(CW+D[0])/2-8&&Math.abs(o.y-PY)<(CH+D[1])/2-10&&(turbo>0?(o.dead=1,sfx(3),false):true)){
   if(md===1||md===3){o.dead=1;if(md===1){tleft-=5;shake=10}sfx(3);vib(80);continue}
   st='over';shake=14;sfx(2);vib(250);
   const s=Math.floor(dist/10);
   if(s>best){best=s;try{localStorage.setItem(md?'corrida_best'+md:'corrida_best',s)}catch(e){}}
  }
 }
 obs=obs.filter(o=>o.y<H+CH&&!o.dead);
}
function txt(t,y,size,col){x.fillStyle=col||'#fff';x.font='800 '+size+'px system-ui,sans-serif';x.textAlign='center';x.fillText(t,W/2,y)}
function draw(){
 x.save();
 if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}
 const T=THEMES[(lvl-1)%4];x.fillStyle=T.g;x.fillRect(0,0,W,H);
 x.fillStyle=T.r;for(let y=0;y<H;y+=8)x.fillRect(sh(y),y,W,9);
 x.fillStyle='#fff';
 for(let i=1;i<3;i++)for(let y=-80+off;y<H;y+=80)x.fillRect(i*LW-3+sh(y+22),y,6,44);
 x.fillStyle=T.e;for(let y=0;y<H;y+=8){const q=sh(y);x.fillRect(q,y,6,9);x.fillRect(q+W-6,y,6,9)}
 if(turbo>0){x.fillStyle='rgba(0,229,255,.35)';x.beginPath();x.ellipse(px,PY,50,80,0,0,7);x.fill()}for(const o of obs)obj(o);
 car(px,PY,PCOLS[ci],1);
 const s=Math.floor(dist/10);
 if(st==='play'){txt(s+' m',44,34);txt('Nível '+lvl+' · Recorde '+best,68,15,'#cfc8ff');if(lvlT>0)txt('Nível '+lvl+' · '+T.n+'!',150,30,'#f5a623');if(slip>0)txt('Óleo! 🛢️',190,24,'#fff');if(mban>0)txt(mtxt,240,18,'#7CFFB2');if(md===1||md===3)txt('⏱️ '+Math.max(0,Math.ceil(tleft))+' s',100,22,tleft<10?'#ff6b81':'#fff');if(turbo>0)txt('⚡ Turbo '+Math.ceil(turbo)+'s',214,22,'#00e5ff');if(tp)txt('Jogador '+(turn+1),124,18,'#ffd23f');x.textAlign='left';x.fillStyle='#ffd23f';x.font='800 20px system-ui,sans-serif';x.fillText('🪙 '+wallet,14,34)}
 else{
  x.fillStyle='rgba(10,8,30,.72)';x.fillRect(0,0,W,H);
  if(st==='menu'){txt('Estrada',130,56);txt('Maluca',180,40,'#9d8bff');txt('Toque na esquerda ou direita',250,17);txt(tp?'ou cada jogador no seu lado':'para trocar de faixa',274,17);txt(['Corra sem fim','60 s: moeda +2 s, batida -5 s','Mais rápido, moedas x2','90 s sem batidas, só relaxar'][md]+(tp?' · 2 jogadores':''),304,15,'#ffd23f');txt('Toque para começar 🏁',340,22,'#f5a623');if(best)txt('Recorde: '+best+' m',376,16,'#cfc8ff')}
  else{txt(md===3?'Fim da viagem 🧘':md===1?'Tempo esgotado! ⏱️':'Batida! 💥',130,34);txt(s+' m',200,60,'#f5a623');txt(s>=best&&s>0?'Novo recorde! 🎉':'Recorde: '+best+' m',240,20,'#cfc8ff');txt('Você chegou ao nível '+lvl,276,18);txt('🪙 +'+got+' moedas · Total '+wallet,310,18,'#ffd23f');txt('Toque para tentar de novo',340,20)}
 }
 if(st!=='play'){
  drawMo();drawM();car(px,PY,PCOLS[ci],1);drawX();txt('Garagem (toque pra comprar) · 🪙 '+wallet,570,14,'#cfc8ff');
  PCOLS.forEach((c,k)=>{const sx=42+k*48;x.fillStyle=c;x.beginPath();x.roundRect(sx,580,36,36,10);x.fill();if(!own[k]){x.fillStyle='rgba(10,8,30,.7)';x.fill();x.fillStyle='#ffd23f';x.font='800 12px system-ui,sans-serif';x.textAlign='center';x.fillText(PRICE[k],sx+18,603)}if(k===ci){x.strokeStyle='#fff';x.lineWidth=3;x.stroke()}});
 }
 x.restore();
}
function loop(t){
 const dt=Math.min(.05,(t-last)/1000||0);last=t;
 if(st==='split'||st==='splitover'){updS(dt);drawS()}else{update(dt);draw()}requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
